name: Pipeline quotidien

on:
  schedule:
    - cron: "17 5 * * *"  # tous les jours à 5 h 17 UTC
  workflow_dispatch:  # bouton "Run workflow" pour le lancer à la main

jobs:
  elt:
    runs-on: ubuntu-latest
    env:
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v7
      - uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Extraction et chargement
        run: python -m ingestion.main --days 30
      - name: Fraîcheur des sources
        working-directory: dbt
        run: dbt source freshness --target prod
      - name: dbt build
        working-directory: dbt
        run: dbt build --target prod
