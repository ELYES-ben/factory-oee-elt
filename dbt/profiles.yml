# Connexions de dbt à BigQuery. Aucun secret ici : le chemin de la clé et l'id du projet
# viennent de variables d'environnement, ce fichier peut donc être commité.
factory_oee:
  target: dev
  outputs:
    dev:
      type: bigquery
      method: service-account
      keyfile: "{{ env_var('GOOGLE_APPLICATION_CREDENTIALS') }}"
      project: "{{ env_var('GCP_PROJECT_ID') }}"
      dataset: dbt_dev
      location: EU
      threads: 4
      job_execution_timeout_seconds: 300
      job_retries: 1
    ci:
      type: bigquery
      method: service-account
      keyfile: "{{ env_var('GOOGLE_APPLICATION_CREDENTIALS') }}"
      project: "{{ env_var('GCP_PROJECT_ID') }}"
      dataset: dbt_ci
      location: EU
      threads: 4
      job_execution_timeout_seconds: 300
      job_retries: 1
    prod:
      type: bigquery
      method: service-account
      keyfile: "{{ env_var('GOOGLE_APPLICATION_CREDENTIALS') }}"
      project: "{{ env_var('GCP_PROJECT_ID') }}"
      dataset: analytics
      location: EU
      threads: 4
      job_execution_timeout_seconds: 300
      job_retries: 1